[server]
# Streamlit walks imported packages and probes transformers vision modules,
# which then fail on missing torchvision. This app only uses text embeddings.
fileWatcherType = "none"

[theme]
primaryColor = "#10a37f"
backgroundColor = "#212121"
secondaryBackgroundColor = "#171717"
textColor = "#ececec"
font = "sans serif"

[browser]
gatherUsageStats = false
